name: Bug agent setup
description: >-
  What the bug agent (#1192) needs to verify a fix in this repository:
  dependencies and generated code, with caches restored but never saved. The
  agent runs code it wrote, and an issue-triggered job saves into master's
  cache scope, which master's CI restores. Called by the shared workflow in
  BoardGamesEmpire/automation, after it checks this repository out.

runs:
  using: composite
  steps:
    # Unit specs need no database. Every Nx run in the job stays off Nx Cloud,
    # the generation in setup-workspace included: each pipeline costs
    # free-plan credits, and the PR's CI checks the fix again. Set first, so
    # the steps below see it.
    - name: Set the environment
      shell: bash
      run: |
        echo "NODE_ENV=test" >> "$GITHUB_ENV"
        echo "NX_NO_CLOUD=true" >> "$GITHUB_ENV"

    - uses: ./.github/actions/setup-workspace
      with:
        save-caches: 'false'
        # No `affected` command runs, and nx-set-shas needs `actions: read`
        # on an issue event.
        set-shas: 'false'
