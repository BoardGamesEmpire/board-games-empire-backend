name: Bug agent

# When someone with write access labels an issue `bug`, the bug agent triages
# it and, for a small fix that needs no decision, opens a draft PR (#1192).
# The workflow itself, its prompts and its rules live in
# BoardGamesEmpire/automation and are shared with the other repositories; this
# file only sets this repository's limits and notes. The agent installs and
# verifies through .github/actions/bug-agent-setup.
#
# Only `labeled`, not `opened`: an issue created with a label fires both
# events, which would start two runs.
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

jobs:
  bug-agent:
    if: github.event.label.name == 'bug' && github.event.sender.type == 'User'
    # One run per issue at a time, and on the job, not the workflow: every
    # label added to the issue starts this workflow, the agent's own labels
    # included, and a run that joined the group would cancel a `bug` run
    # waiting in it. A skipped job never joins. `queue: max` keeps a second
    # `bug` run waiting instead of replacing the one already waiting (#1220).
    # actionlint doesn't know `queue` yet and reports it as an unknown key.
    concurrency:
      group: bug-agent-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    # At `master`, unpinned, so a change to the shared workflow applies here
    # without a PR in this repository. A pin would freeze the workflow
    # itself: its jobs, their permissions, and which steps receive the
    # secrets. It would not freeze its prompts and scripts, which it reads
    # from automation's `master` whatever ref this names, and which receive
    # the API key and the app's short-lived token.
    uses: BoardGamesEmpire/automation/.github/workflows/bug-agent.yml@master
    with:
      bge-agent-client-id: ${{ vars.BGE_AGENT_CLIENT_ID }}
      fix-tools: 'Bash(npm run nx:*)'
      # Schema and migrations, the gRPC contracts, dependencies and the Nx
      # workspace config each need a person's review. A fix once carried a
      # rewritten buf.lock and a new .nxignore into its PR unnoticed (#733,
      # #1375).
      protected-paths: |
        prisma/*
        *.proto
        package.json
        */package.json
        package-lock.json
        */buf.yaml
        */buf.lock
        nx.json
        .nxignore
      test-paths: |
        *.spec.ts
        *.e2e-spec.ts
        */fixtures/*
        */__fixtures__/*
      # One feature lib per fix.
      module-pattern: '^libs/api/([^/]+)/'
      max-lines: 100
      notes: |
        Read `AGENTS.md`. Use the vocabulary in `GLOSSARY.md`, and read
        `docs/agents/gotchas.md` before touching anything it lists.

        Run Nx as `npm run nx <command>`, never `npx nx`. Verify each affected
        project with `npm run nx run <project>:test`,
        `npm run nx run <project>:lint` and
        `npm run nx run <project>:typecheck`, then
        `npm run nx -- format:check --all`.

        A fix that changes the permission catalog or a permission condition
        needs a person.
    secrets:
      bge-agent-private-key: ${{ secrets.BGE_AGENT_PRIVATE_KEY }}
      # The agent runs through the Claude Agent SDK on this key. Not workload
      # identity federation for now: it came with the Claude Code GitHub
      # Action, whose requests promotional credit doesn't cover (#1192).
      anthropic-api-key: ${{ secrets.BGE_AGENT_ANTHROPIC_API_KEY }}
