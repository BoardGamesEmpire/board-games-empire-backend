name: Bug agent

# When someone with write access labels an issue `bug`, an agent triages it
# (#1192): it asks for detail (`needs-info`), hands it to a person
# (`ready-for-human`), or, when the fix is small and needs no decision, fixes
# it and opens a draft PR (`ready-for-agent`).
#
# Three jobs, so the agent never holds a token that can write:
#
# - triage: the agent reads the issue and the code, with read-only tools, and
#   returns a decision. No dependency install, so the common outcomes cost
#   little.
# - fix: only for `ready-for-agent`. The agent writes a test and a fix and
#   runs them, which means it runs code it wrote. The job's token can only
#   read, and its caches are restored but never saved, because an
#   issue-triggered job saves into master's cache scope.
# - publish: holds the app token and runs no agent code. It checks the fix
#   against the limits, commits it through the API, opens the PR, and labels
#   and comments on the issue. .github/bug-agent/publish.sh has the detail.
#
# Only `labeled`, not `opened`: an issue created with a label fires both
# events, which would start two runs.
on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: bug-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  ISSUE_NUMBER: ${{ github.event.issue.number }}

jobs:
  triage:
    if: github.event.label.name == 'bug' && github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
      decision: ${{ steps.agent.outputs.structured_output }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the prompt
        id: prompt
        run: |
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Issue number: ${ISSUE_NUMBER}"
            echo
            cat .github/bug-agent/triage.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run the agent
        id: agent
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          GH_TOKEN: ${{ github.token }}
          # Keeps the API key out of the commands the agent runs.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          # A Claude Console API key, billed per token to the Console
          # organization. A subscription token from `claude setup-token` also
          # works, as `claude_code_oauth_token`.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          # The model and its reasoning effort are pinned, so they, and what a
          # run costs, change only here and never with the action's or Claude
          # Code's own defaults.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["needs-info","ready-for-human","ready-for-agent"]},"comment":{"type":"string"}},"required":["outcome","comment"],"additionalProperties":false}'

      - name: Read the outcome
        id: outcome
        env:
          DECISION: ${{ steps.agent.outputs.structured_output }}
        run: |
          outcome="$(jq -r '.outcome // ""' <<<"$DECISION")"
          case "$outcome" in
            needs-info | ready-for-human | ready-for-agent) echo "outcome=$outcome" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::no usable outcome in the agent's result"; exit 1 ;;
          esac

  fix:
    needs: triage
    if: needs.triage.outputs.outcome == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    env:
      NODE_ENV: test
      # The agent's own runs stay off Nx Cloud: each pipeline costs free-plan
      # credits, and the PR's CI run checks the fix again.
      NX_NO_CLOUD: 'true'
    outputs:
      result: ${{ steps.agent.outputs.structured_output }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          save-caches: 'false'
          set-shas: 'false'

      - name: Build the prompt
        id: prompt
        env:
          DECISION: ${{ needs.triage.outputs.decision }}
        run: |
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Issue number: ${ISSUE_NUMBER}"
            echo
            cat .github/bug-agent/fix.md
            echo
            echo "## The triage run's reasoning"
            echo
            jq -r '.comment' <<<"$DECISION"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run the agent
        id: agent
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run nx:*),Bash(gh issue view:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["fixed","ready-for-human"]},"comment":{"type":"string"},"commit_subject":{"type":"string"},"commit_body":{"type":"string"},"pr_body":{"type":"string"}},"required":["outcome","comment","commit_subject","commit_body","pr_body"],"additionalProperties":false}'

      # The working tree's changes, as the agent left them. Setup's outputs
      # (.env, node_modules, generated code) are all gitignored.
      - name: Collect the fix
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/fix.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-patch
          path: ${{ runner.temp }}/fix.patch
          retention-days: 7

  publish:
    needs: [triage, fix]
    if: always() && github.event.label.name == 'bug' && github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The bge-agent GitHub App. Its commits through the API are signed by
      # GitHub and attributed to the app's bot account, and a PR it opens
      # triggers CI, which one opened with the default token would not. Scoped
      # to this repository, with no workflow permission and no way to merge.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BGE_AGENT_CLIENT_ID }}
          private-key: ${{ secrets.BGE_AGENT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.fix.result == 'success'
        with:
          name: fix-patch
          path: ${{ runner.temp }}/fix

      - name: Publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BASE_SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIAGE_RESULT: ${{ needs.triage.result }}
          TRIAGE_JSON: ${{ needs.triage.outputs.decision }}
          FIX_RESULT: ${{ needs.fix.result }}
          FIX_JSON: ${{ needs.fix.outputs.result }}
          PATCH_FILE: ${{ runner.temp }}/fix/fix.patch
        run: bash .github/bug-agent/publish.sh
