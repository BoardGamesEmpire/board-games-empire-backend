name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  actions: read
  contents: read

# Superseded pushes to a PR stop running instead of burning minutes to
# completion (#259). Push events (master) get a per-commit group instead of
# an exemption flag: GitHub keeps at most one PENDING run per group even
# with cancel-in-progress disabled, so a shared master group would silently
# drop the middle commit of a merge burst and serialize master runs behind
# the e2e job. A per-sha group means every master commit gets its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Renovate's PR runs don't connect to Nx Cloud (#599). Nx Cloud bills a flat
# 500 credits per CI pipeline execution against the free plan's monthly
# allowance, and Renovate pushes to its branch again every time an update
# moves. Those runs lose the remote cache and run every task on the runner,
# which a public repository doesn't pay for. Merges to master still connect:
# that run fills the cache the other runs read.
#
# Matched on the PR's branch and its author, not on whoever pushed last, so a
# person's fix pushed to a Renovate branch stays off Nx Cloud too. Either match
# is enough on its own: `renovate/` is the `branchPrefix` in
# .github/renovate.json and `renovate[bot]` is the app's account, so a change
# to one doesn't put Renovate's runs back on Nx Cloud. The value reaches Nx as
# the string 'true' or 'false', and Nx disconnects only on exactly 'true', so
# every other run is unchanged.
env:
  NX_NO_CLOUD: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'renovate/') || github.event.pull_request.user.login == 'renovate[bot]') }}

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # `testing`, not the ecosystem-default `test`: the valid set is
      # development|testing|staging|production, declared in
      # apps/api/src/app/configuration/system.config.ts. `test` fails that
      # validation, so nothing here can boot the app under it (#286).
      NODE_ENV: testing

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          filter: tree:0
          fetch-depth: 0

      # Coverage maps back to source lines only when a project's `.spec.swcrc`
      # sets `"sourceMaps": "inline"`. With `true`, the value Nx's generator
      # writes, istanbul silently reports compiled-JS line numbers and Codecov
      # marks the wrong lines (#524). The script explains why.
      #
      # It needs only git and node (the runner's own, since setup-workspace
      # hasn't run), so it goes first and a bad file fails in seconds rather than
      # after the install. Whole-tree and uncached, like `format:check --all`
      # below: a jest spec doing the same job would be served from the Nx cache,
      # because other projects' `.spec.swcrc` files aren't inputs of its `test`
      # target.
      - name: Check spec swcrc source maps
        run: node libs/scripts/src/bin/check-spec-swcrc.js

      - uses: ./.github/actions/setup-workspace

      - name: Clean stale dist directories
        run: find libs apps -name "dist" -type d -prune -exec rm -rf {} + 2>/dev/null || true

      # Prettier was never enforced anywhere in the pipeline before #314 — `lint`
      # is ESLint, which is not configured to report formatting — and 100 tracked
      # files had drifted by the time anyone measured.
      #
      # `--all` is load-bearing, not belt-and-braces. Without it `format:check`
      # inspects only files affected relative to the base, which is precisely how
      # the drift accumulated unseen: nothing ever looked at a file nobody was
      # touching. An affected-scoped gate would not have caught the problem it is
      # here to prevent from recurring.
      #
      # Cheap enough to run first and fail fast: ~9s over the full tree, against
      # minutes for the typecheck/test/build block below.
      #
      # Generated output is excluded via .prettierignore rather than .gitignore —
      # prettier does not read nested .gitignore files, so a whole-repo run picks
      # the proto codegen straight back up. See the comment there.
      - name: Check formatting
        run: npx nx format:check --all

      # Replaces the i18n drift gate removed in #260, and guards a real hole rather
      # than a cosmetic one.
      #
      # `i18n.generated.ts` is generated and gitignored, so it is absent from Nx's
      # file map and cannot be a `typecheck` input. The catalog JSONs are inputs of
      # `i18n-core:typecheck` alone (see below), not of the projects that compile
      # against it. A catalog-only change therefore regenerates the type while
      # leaving every other `typecheck` hash unchanged, and Nx serves the verdict it
      # cached for the PREVIOUS type. Deleting a key without touching its call sites
      # goes green.
      #
      # Nothing else catches it: the app builds do not type-check (tsPlugins is not
      # wired to ts-loader's `transformers`, so it runs transpileOnly), and Jest
      # erases the type-only imports through @swc/jest. Verified by deleting
      # `errors.household.last_owner` — cached typecheck and a full `api:build` both
      # pass; `typecheck --skip-nx-cache` fails with TS2345.
      #
      # So when the catalogs move, bypass the cache. Strictly stronger than the old
      # gate, which only compared bytes: this compiles the workspace against the
      # regenerated type. Catalogs change rarely, so the cost is paid rarely.
      #
      # KNOWN COST, accepted: `--skip-nx-cache` also severs the Nx Cloud connection
      # for that command. On exactly the runs where typecheck is load-bearing, the
      # typecheck tasks are therefore absent from the Nx Cloud report, their results
      # are not written to the remote cache (so the follow-on master push
      # re-typechecks uncached), and `nx fix-ci` below has no record of them to act
      # on. Self-healing and reporting are lost on those runs.
      #
      # Correctness after them holds only because the catalogs are inputs of
      # `i18n-core:typecheck`, which emits the declarations every other project
      # compiles against. Before the input, a catalog change left that task's hash
      # unchanged, and since this step writes nothing, the entry cached before the
      # change stayed current. Every later run whose own diff missed the catalogs
      # restored declarations without the change: #615 failed on a key #605 had
      # added (#619). With the input, the old entry stops matching, and the first
      # run that uses the cache writes a fresh one. docs/NX_CACHING.md has why the
      # target names its inputs and how to keep the list current.
      #
      # `--no-renames` is load-bearing: with rename detection on (the default),
      # `git diff --name-only` reports ONLY the destination path, so moving a
      # catalog out of `src/lib/i18n/` would not match this pattern — while
      # `i18n:generate`'s own inputs DID change, dropping that whole subtree from
      # `I18nTranslations`. That is the failure this step exists to catch, at its
      # largest. `--no-renames` reports the old path too, so the move matches.
      #
      # `set -euo pipefail` matters for the same reason: without it a git failure is
      # swallowed by the exit status of whatever follows it in the pipe and the step
      # reports `changed=false` — failing OPEN on the only guard standing between a
      # catalog key deletion and a green master. The explicit NX_BASE/NX_HEAD
      # assertions cover nx-set-shas failing, changing its env-var contract, or
      # `fetch-depth` being reduced.
      #
      # The diff is captured BEFORE matching, and matched with `grep -c` rather than
      # `grep -q`, because `pipefail` and `grep -q` together reintroduce the same
      # fail-open from the other end: `-q` exits on the first match, its producer
      # gets SIGPIPE (141), `pipefail` propagates that, and the `if` takes the false
      # branch — so a catalog change that sorts EARLY in a large diff reports
      # `changed=false`. Reproduced with a 4001-file diff. `grep -c` has to read to
      # EOF, so it cannot kill its producer; `|| true` absorbs its exit 1 on zero
      # matches without hiding a git failure, which `set -e` catches on the
      # assignment above.
      - name: Detect i18n catalog changes
        id: catalogs
        shell: bash
        run: |
          set -euo pipefail
          : "${NX_BASE:?NX_BASE is unset — nx-set-shas did not run or changed its contract}"
          : "${NX_HEAD:?NX_HEAD is unset — nx-set-shas did not run or changed its contract}"
          files="$(git diff --no-renames --name-only "$NX_BASE" "$NX_HEAD")"
          matches="$(printf '%s\n' "$files" | grep -c '^libs/common/i18n-core/src/lib/i18n/' || true)"
          changed=false
          if [ "$matches" -gt 0 ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "i18n catalogs changed: $changed ($matches catalog file(s))"

      - run: npx nx run-many -t typecheck ${{ steps.catalogs.outputs.changed == 'true' && '--skip-nx-cache' || '' }}
      # `run-many`, not `affected`, so every commit uploads a WHOLE-workspace
      # report: an affected-only upload would show Codecov a handful of
      # projects and read as a collapse in project coverage. The cost stays
      # close to `affected` because the test target caches its coverage
      # directory as an output — an unaffected project is a cache hit that
      # restores its lcov without running a suite.
      #
      # `--coverage` is part of the task hash, so it must be passed on every
      # run or the cache splits into with- and without-coverage halves.
      - run: npx nx run-many -t test --coverage --parallel --maxParallel=3 --passWithNoTests

      # Explicit list rather than the uploader's own search: that search walks
      # the whole tree, and this pins the upload to exactly what the jest
      # preset writes. Paths inside each lcov are repo-relative — see
      # `coverageReporters` in jest.preset.js for why that matters.
      - name: Collect coverage reports
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          files="$(find apps libs -path '*/node_modules' -prune -o -path '*/test-output/jest/coverage/lcov.info' -print | sort | paste -sd, -)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "coverage reports: $(printf '%s' "$files" | tr ',' '\n' | grep -c . || true)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage.outputs.files }}
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
      - run: npx nx affected -t lint build --parallel --maxParallel=3

      # Nx Cloud self-healing stays scoped to this job (D-259-1): letting it
      # act on e2e failures against real containers is not something to
      # invite while the suite's flake profile is uncharacterised. It needs Nx
      # Cloud, so it is skipped on the runs that `NX_NO_CLOUD` keeps off it.
      - run: npx nx fix-ci
        if: always() && env.NX_NO_CLOUD != 'true'

  # Black-box e2e gate (#259). Provisions real Postgres + Redis via
  # testcontainers on the runner's Docker daemon (D-1 on #255). Advisory at
  # first, then flipped to required in branch protection once flake is
  # characterised (D-259-5).
  #
  # Gated on `main` rather than run alongside it — this revises D-259-1,
  # which assumed this job would need only a cached `api:build`. It does
  # not: the api bundle externalizes its workspace libraries, so this job
  # builds the same affected graph `main` does. Run concurrently, a cold
  # cache pays for that graph twice; run after, those builds are Nx Cloud
  # cache hits and a failing lint or unit suite costs no container minutes
  # at all. Unit feedback timing is unchanged either way — only the e2e
  # verdict arrives later. Renovate's runs are the exception: they skip Nx
  # Cloud (NX_NO_CLOUD above), so this job builds the affected graph again.
  e2e:
    needs: main
    runs-on: ubuntu-latest
    # Hard stop for the whole job, setup included: npm ci, generation, and
    # (on a cache miss) the affected build all land before the suite starts
    # (D-259-7).
    timeout-minutes: 30
    env:
      # Same value and reasoning as the `main` job. Covers the Jest process,
      # prisma migrate, and prisma db seed — NOT the API, worker and gateway
      # children, which the harness pins separately (apiEnvOverrides,
      # workerEnvOverrides, useGateway) because Jest's CLI assigns `test`
      # whenever the variable is unset.
      NODE_ENV: testing

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      # Built separately from the suite step for two reasons: `--parallel=1`
      # below serializes the entire task graph, and the api bundle
      # externalizes its workspace libraries, so `api:build` pulls ~40 `^build`
      # tasks that have no business running one at a time. Affected-scoped:
      # a doc-only PR runs no build tasks here, though the job still pays
      # checkout and setup regardless.
      - name: Build affected projects
        run: npx nx affected -t build --parallel --maxParallel=3

      # `affected` keeps doc-only PRs from paying the suites; each e2e app's
      # implicitDependencies pull it in for any change to the app it tests,
      # and ci.yml itself is in sharedGlobals.
      - name: Run e2e suite
        timeout-minutes: 20
        env:
          # Stream every child's full output (API, worker, gateways) into the
          # job log so a mid-run assertion failure is diagnosable without a
          # local repro (#259). Failure-scoped alternative tracked as #274.
          BGE_E2E_VERBOSE: 'true'
        run: npx nx affected -t e2e --parallel=1

  # The image smoke suite (#600). It builds the BGE image and both gateway
  # images, then runs them as the split profile and drives them from outside:
  # a first boot on an empty database, an account, a search and an import
  # through a stub gateway, the bundled web client in Chromium, and a clean
  # shutdown (apps/image-smoke). No other test runs the images, and none
  # boots the worker, gateway-fetch and coordinator roles.
  #
  # Each platform builds and runs on a runner of its own, natively: the
  # arm64 image migrates with its own Prisma engine, which no amd64 run
  # loads. Nothing is pushed, and the job writes nothing outside the runner.
  #
  # Not gated on `main`: the images build from the Dockerfile, not from Nx's
  # cache, so nothing here waits on main's builds. And not `affected`: every
  # change reaches the images' build context, and a client bump changes only
  # the Dockerfile.
  image-smoke:
    name: image smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # The suite runs the images these name. compose.yaml reads the same
      # variables.
      BGE_IMAGE: bge:smoke
      BGE_BOARDGAMEGEEK_GATEWAY_IMAGE: bge-boardgamegeek-gateway:smoke
      BGE_IGDB_GATEWAY_IMAGE: bge-igdb-gateway:smoke

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          filter: tree:0
          fetch-depth: 0
          # Nothing after the checkout needs the token.
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # Built by the runner's own Docker, so each image lands where Compose
      # finds it. The labels are those a published image carries: the
      # commit, the version the build stamps, and the commit's date, in UTC.
      - name: Build the images
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          version="$(node -p 'require("./package.json").version')"
          created="$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)"
          labels=(--build-arg "REVISION=$revision" --build-arg "VERSION=$version" --build-arg "CREATED=$created")
          docker build --target bge "${labels[@]}" --tag "$BGE_IMAGE" .
          docker build --target boardgamegeek-gateway "${labels[@]}" --tag "$BGE_BOARDGAMEGEEK_GATEWAY_IMAGE" .
          docker build --target igdb-gateway "${labels[@]}" --tag "$BGE_IGDB_GATEWAY_IMAGE" .
          for image in "$BGE_IMAGE" "$BGE_BOARDGAMEGEEK_GATEWAY_IMAGE" "$BGE_IGDB_GATEWAY_IMAGE"; do
            docker image inspect --format "$image {{.Id}}" "$image"
          done
          docker image inspect --format 'web client: {{index .Config.Labels "io.github.boardgamesempire.web.image"}}' "$BGE_IMAGE"

      # Only the headless shell: the suite runs Chromium headless.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # Builds the stub gateway first (the target's dependency); the suite
      # then adds it to the BGE image it is about to test.
      - name: Run the image smoke suite
        timeout-minutes: 25
        run: npx nx run @boardgamesempire/image-smoke:smoke

      # The suite saves every container's output before removing the stack, in
      # a directory named after its Compose project. A job that failed before
      # the suite started a stack has nothing to print.
      - name: Print the stack's logs
        if: failure() && hashFiles('apps/image-smoke/test-output/*/logs/*.log') != ''
        run: tail -n +1 apps/image-smoke/test-output/*/logs/*.log
